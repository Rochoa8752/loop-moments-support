<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1630">
<title>Fibsgiving</title>
<meta name="description" content="A draw-and-bluff family party game for your phones.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><div class="center-screen"><div class="big-emoji bob">🦃</div><p>Warming up the oven…</p></div></div>
<div id="chat" class="chat hidden" role="dialog" aria-label="Family chat">
  <div class="chat-head"><b>💬 Family Chat</b><button id="chatClose" class="iconbtn" aria-label="Close chat">✕</button></div>
  <div id="chatList" class="chat-list"></div>
  <div id="chatQuick" class="chat-quick"></div>
  <form id="chatForm" class="chat-form" autocomplete="off"><input id="chatIn" maxlength="300" placeholder="Say something to the family…" enterkeyhint="send"><button class="btn small" type="submit">Send</button></form>
  <div id="chatRO" class="tiny center hidden" style="padding:10px">📺 TV mode is read-only</div>
</div>
<div id="fx"></div>
<div id="toast"></div>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="decks.js"></script>
<script src="app.js"></script>
</body>
</html>
